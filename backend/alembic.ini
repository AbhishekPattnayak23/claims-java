# Alembic configuration file for Solmar Workflow Automation Platform

[alembic]
# Path to migration scripts
alembic = backend/alembic
# Where to store SQLAlchemy database models
script_location = backend/alembic
# Database URL (can be overridden with env variable)
sqlalchemy.url = sqlite:///./solmar.db
# Set to 'true' to run migration in a transaction
transactional_ddl = true
# Output path for 'offline' SQL
output_encoding = utf-8

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
datefmt = %H:%M:%S
